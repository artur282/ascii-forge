[package]
name = "ascii-forge"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "AI-driven ASCII art, images, GIFs and videos from the command line"
license = "MIT OR Apache-2.0"
repository = "https://github.com/artur282/ascii-forge"
keywords = ["ascii", "cli", "art", "gif", "video"]
categories = ["command-line-utilities", "multimedia::images", "multimedia::video"]

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6"
figlet-rs = "1"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
imageproc = "0.27"
quantette = "0.6"
quick-xml = "0.42"
ratatui = "0.30"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", features = ["json"] }
unicode-normalization = "0.1"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
predicates = "3"

[patch.crates-io]
figlet-rs = { path = "vendor/figlet-rs" }
