name: Feature request
description: Propose a new capability for ASCII Forge
title: "feat: "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Keep the scope small enough for one reviewable change.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What exists today and what hurts?
      placeholder: Today ASCII Forge ... but ...
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: What should happen, in observable terms?
      placeholder: When I run ..., I expect ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, testable items. Include tests and documentation.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] Tests and documentation.
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Suggested implementation
      description: Files, APIs or approach. Optional.
      placeholder: The expected modules are ...
    validations:
      required: false

  - type: textarea
    id: risks
    attributes:
      label: Risks and limits
      description: What could fail, and what is explicitly not promised?
      placeholder: This may not work for ...
    validations:
      required: false

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What does this issue not include?
      placeholder: This issue does not include ...
    validations:
      required: false
