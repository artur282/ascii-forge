name: Bug report
description: Report a defect in ASCII Forge
title: "fix: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. See SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact command and scene file if possible.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ASCII Forge version
      description: Output of `ascii-forge --version`.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Built from source
        - Release tarball
        - Cargo install
        - Other
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots or output. Remove secrets first.
    validations:
      required: false

  - type: textarea
    id: cause
    attributes:
      label: Possible cause
      description: Optional.
    validations:
      required: false
