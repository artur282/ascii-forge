name: Release

# Only tag pushes publish releases; ordinary branch pushes and pull requests
# never run this workflow. Tests and lints stay in ci.yml.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="ascii-forge-${GITHUB_REF_NAME}-${TARGET}"
          staging="dist/${name}"
          mkdir -p "${staging}"
          cp "target/${TARGET}/release/ascii-forge" "${staging}/"
          cp README.md LICENSE-MIT LICENSE-APACHE install.sh "${staging}/"
          tar -czf "dist/${name}.tar.gz" -C "${staging}" .

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $name = "ascii-forge-$env:GITHUB_REF_NAME-$env:TARGET"
          $staging = "dist/$name"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/$env:TARGET/release/ascii-forge.exe" "$staging/ascii-forge.exe"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, install.sh -Destination $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/$name.zip"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ascii-forge-${{ matrix.target }}
          path: dist/ascii-forge-*-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ASCII Forge ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
