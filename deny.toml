# cargo-deny configuration for ASCII Forge.
#
# Run locally with `cargo deny check`. The `deny` job in
# `.github/workflows/ci.yml` runs `cargo deny --locked check` on every push and
# pull request, so this file is the single source of dependency policy.
# The allow list covers permissive licenses present in the current dependency
# tree. SPDX expressions with alternatives are accepted when any alternative is
# allowed (for example `Unlicense OR MIT` passes through MIT).

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "transitive unmaintained chrono via rmcp/schemars; no vulnerability or unsound advisory matches" },
  { id = "RUSTSEC-2026-0192", reason = "transitive unmaintained ttf-parser via ab_glyph; track a skrifa/owned_ttf_parser update" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
