# cargo-deny configuration for ASCII Forge.
#
# Run locally with `cargo deny check`. This file is not wired into CI yet.
# The allow list covers permissive licenses present in the current dependency
# tree. SPDX expressions with alternatives are accepted when any alternative is
# allowed (for example `Unlicense OR MIT` passes through MIT).

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
